[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/sim", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Wayne Van Son"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# SpacetimeDB: keep the CLI, module crate and npm client on the same version.
spacetimedb = "=2.16.3"
serde_json = "1"
bincode = "1.3"
spacetimedb-sdk = "=2.16.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Browser builds prefer size over native throughput. `wasm-opt -Oz` still runs
# on the generated binary, but `opt-level = "z"` lets rustc do its share first.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
