[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Wayne Van Son"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Keep this in lockstep with the installed `wasm-bindgen-cli`.
wasm-bindgen = "=0.2.121"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
