[package]
name = "dodgeball-sim"
description = "Deterministic ECS simulation core for the dodgeball game"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The browser wrapper is the only part that needs wasm-bindgen. The same
# crate is also compiled into the SpacetimeDB server module, which targets
# wasm32 but must not link the browser bindings.
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
serde.workspace = true
wasm-bindgen = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
bincode.workspace = true
