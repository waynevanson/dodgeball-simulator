name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: dodgeball-linux
            binary: target/release/dodgeball
          - os: windows-latest
            artifact: dodgeball-windows
            binary: target/release/dodgeball.exe
          - os: macos-latest
            artifact: dodgeball-macos
            binary: target/release/dodgeball

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxfixes-dev libxrender-dev libxext-dev \
            libudev-dev libasound2-dev

      - name: Build desktop client
        run: cargo build -p dodgeball-client-desktop --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
